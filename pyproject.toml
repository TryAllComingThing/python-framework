[build-system]
requires = ["setuptools>=84.1", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "python-framework"
version = "3.4.0"
description = "System Foundation modular FastAPI backend starter"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.4,<3",
  "defusedxml>=0.7.1,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.13,<2", "argon2-cffi>=23,<26", "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "openpyxl>=3.1,<4", "ruff==0.9.10", "mypy==1.15.0", "bandit>=1.7,<2", "pip-audit>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
